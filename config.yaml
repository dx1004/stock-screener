# Quant Analysis Engine Configuration

# Stock Universe - Add/remove tickers as needed
stock_universe:
  # Tech
  - AAPL
  - MSFT
  - GOOGL
  - META
  - NVDA
  - AMD
  - TSLA
  - NFLX

  # Finance
  - JPM
  - BAC
  - GS
  - MS

  # Healthcare
  - JNJ
  - UNH
  - PFE
  - ABBV

  # Consumer
  - AMZN
  - WMT
  - HD
  - NKE
  - SBUX

  # Industrial
  - BA
  - CAT
  - GE
  - UPS

  # Energy
  - XOM
  - CVX

  # Current holdings to keep in the sell-signal review
  # Add your current holdings here so they get evaluated for Phase 3/4 sell signals.

  # Add more tickers here...

# Current holdings for explicit HOLD / SELL actions.
holdings: []

# Screening Parameters
parameters:
  # Minimum score thresholds
  min_buy_score: 70
  min_sell_score: 60

  # Market breadth requirement
  min_phase2_pct: 15.0

  # Data requirements
  min_data_days: 200

  # Volume threshold for breakouts
  volume_threshold: 1.5

  # Maximum extension from 50 SMA for buy signals
  max_extension_pct: 25.0

  # Cache settings
  cache_expiry_hours: 24

# Output Settings
output:
  # Print detailed fundamental snapshots
  show_fundamentals: true

  # Print detailed phase analysis
  show_phase_details: true

  # Save results to file
  save_to_file: true
  output_dir: "./data/results"

# Risk-control and sizing policy for weekly screening report
risk_control:
  # ATR and position gates
  atr_period: 14
  spy_atr_period: 14
  spy_atr_multiple: 2.0
  min_atr_distance_multiple: 2.0
  max_stop_distance_pct: 0.08
  min_rr: 2.5
  max_data_staleness_days: 3

  # Liquidity gates
  min_entry_price: 10.0
  min_median_20d_dollar_volume: 20000000  # $20M

  # Sizing policy (algebraic with capital C)
  base_risk_budget_pct: 1.0
  max_notional_pct: 10.0

  # Output / selection constraints
  max_new_buys: 2
