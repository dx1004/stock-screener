name: Weekly Stock Screening (Git-Based Storage)

on:
  schedule:
    # Run every Friday at 10:00 PM UTC (6:00 PM Eastern during daylight saving time)
    - cron: '0 22 * * 5'

  # Allow manual triggering, including small smoke-test runs before relying on the schedule.
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Optional space-separated ticker override for test runs, e.g. AAPL MSFT NVDA'
        required: false
        type: string
      no_save:
        description: 'Skip saving quant_screen output files during manual tests'
        required: false
        default: false
        type: boolean

jobs:
  screen-stocks:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit generated screening data

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "time=$(date +'%H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekend quant screen
        env:
<<<<<<< ours
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
=======
>>>>>>> theirs
          INPUT_TICKERS: ${{ inputs.tickers }}
          INPUT_NO_SAVE: ${{ inputs.no_save }}
        run: |
          mkdir -p data/cache data/results data/logs
          chmod +x ./run_screen.sh

          RUN_ARGS=(--cache-dir ./data/cache)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${INPUT_TICKERS}" ]; then
            read -r -a TICKERS <<< "${INPUT_TICKERS}"
            RUN_ARGS+=(--tickers "${TICKERS[@]}")
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${INPUT_NO_SAVE}" = "true" ]; then
            RUN_ARGS+=(--no-save)
          fi

          ./run_screen.sh "${RUN_ARGS[@]}" | tee data/logs/weekly_screen_${{ steps.date.outputs.date }}.log

      - name: Commit generated screening data
        id: commit
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Keep the Git-based data cache and weekend reports in the repository.
          git add data/

          if git diff --staged --quiet; then
            echo "No generated data changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            CHANGED_FILES=$(git diff --staged --name-only | wc -l | tr -d ' ')
            echo "Committing $CHANGED_FILES generated data files"
            git commit -m "chore: update weekly screening data - ${{ steps.date.outputs.date }}"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.commit.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Upload screening results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-screening-results-${{ steps.date.outputs.date }}
          path: |
            data/results/
            data/logs/
          if-no-files-found: warn
          retention-days: 90
